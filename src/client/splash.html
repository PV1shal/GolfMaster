<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" type="text/css" href="splash.css" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Daily Golf</title>
  </head>
  <body class="app">
    <main class="card">
      <p class="eyebrow" id="eyebrow">Daily Golf</p>
      <h1 class="title" id="title">Today's hole</h1>
      <p class="facts" id="facts">&nbsp;</p>
      <p class="you" id="you" hidden></p>
      <button class="start-button" id="start-button">Tee off</button>
      <p class="hint">Swipe up to swing · fewest strokes wins, fewest tries breaks ties</p>
    </main>
    <script type="module" src="splash.ts" defer></script>
  </body>
</html>
